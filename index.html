
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Double Take World</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h1 {
      font-size: clamp(3rem, 9vw, 8rem);
      margin: 0;
      letter-spacing: -0.06em;
    }
    p { color: #aaa; }
    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
      margin-top: 50px;
    }
    nav a {
      color: white;
      text-decoration: none;
      border-bottom: 1px solid #777;
      padding-bottom: 8px;
    }
    nav a:hover { color: #ff453a; }
  </style>
</head>
<body>
  <main>
    <h1>DOUBLE TAKE</h1>
    <p>Miracles, engineered.</p>
    <nav>
      <a href="#coffee">COFFEE & BAR</a>
      <a href="#lab">LAB</a>
      <a href="#press">PRESS</a>
      <a href="#music">MUSIC</a>
    </nav>
  </main>
</body>
</html>
